plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.sonometro'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.sonometro"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// --- Generar documentación Javadoc del código Java ---
tasks.register('generateJavadoc', Javadoc) {
    // Rutas del código fuente Java
    source = android.sourceSets.main.java.srcDirs

    // Incluir el classpath del SDK de Android (necesario para evitar errores)
    classpath += files(android.getBootClasspath().join(File.pathSeparator))

    // Carpeta donde se guardará la documentación HTML
    destinationDir = file("$buildDir/docs/javadoc")

    // Ignorar errores de dependencias que no sean de tu código
    failOnError false

    // Localización en español (opcional)
    options.locale = 'es'
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'

    // Título de la documentación
    options.windowTitle = "Documentación Javadoc - Sonómetro"
    options.docTitle = "Documentación del Proyecto Sonómetro"

    // Agregar enlaces a documentación externa (opcional)
    options.links("https://developer.android.com/reference/")
}