plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.sonometro'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.sonometro"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    // Firebase: el BoM fija versiones compatibles entre sí
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// --- Generar documentación Javadoc del código Java ---
tasks.register('generateJavadoc', Javadoc) {
    // CORRECCIÓN: Se añade el String de razón requerido por Gradle 8+
    doNotTrackState("Inconsistent Android SDK classpath structure causes tracking failures in Gradle 8.x+")

    options.windowTitle = "Documentación Javadoc - Sonómetro"
    options.docTitle = "Documentación del Proyecto Sonómetro"

    // 1. Define el código fuente que quieres documentar
    source = android.sourceSets.main.java.srcDirs

    // 2. Definición de la CLASSPATH (Método más robusto)
    // Inicialmente toma la bootClasspath del Android SDK
    classpath += project.files(android.getBootClasspath())

    // Agregamos todas las dependencias compiladas de la variante 'release' (o 'debug')
    android.applicationVariants.all { variant ->
        // Si no se encuentra la variante 'release' se intenta con 'debug'
        if (variant.name == 'release') {
            classpath += variant.javaCompileProvider.get().classpath
        }
    }

    // 3. Define la carpeta donde se guardará el Javadoc
    destinationDir = file("$buildDir/javadoc")

    // 4. Opciones adicionales
    failOnError false
    options.addStringOption('Xdoclint:none', '-quiet')
    options.locale = 'es'
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'

    // 5. Agregar enlaces a documentación externa
    options.links("https://developer.android.com/reference/")
}

